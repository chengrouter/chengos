name: ChengFlow Desktop

# Packaging is expensive (a full Rust build of the engine per platform), so it
# runs on demand and on tags rather than on every push.
on:
  workflow_dispatch:
    inputs:
      allow_no_postgres:
        description: "Build without bundled PostgreSQL (development bundle only)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: it is out of scope until there is a
        # signing identity and a notarization step to go with it.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Tauri links webkit2gtk on Linux, which is why `src-tauri` is its own
      # Cargo workspace: the main workspace must stay buildable without it.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libpq-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chengflow-ui/src-tauri

      - name: Test the desktop shell
        working-directory: chengflow-ui/src-tauri
        run: cargo test

      - name: Test the embedded server configuration
        working-directory: chengflow
        # Only the library-ized startup path and what LAN host mode exposes
        # (static UI serving, client-address throttling) — the rest of the
        # workspace is covered by the main CI job and needs a database.
        run: >-
          cargo test -p cheng-api --lib --
          embedded:: runtime_capabilities:: middleware::client_ip::
          rest::handlers::auth::tests::

  # Cheap cfg-regression gate: type-checks the backend for the Windows target
  # from Linux (stub C toolchain, no linking), so Unix-only code that escapes
  # its gate fails here rather than on the Windows builder.
  windows-target:
    name: Windows target type check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chengflow -> target/win-check
      - name: Type-check backend crates for x86_64-pc-windows-msvc
        working-directory: chengflow
        run: bash scripts/check-windows-target.sh

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [check, windows-target]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libpq-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chengflow-ui/src-tauri

      # PostgreSQL and ffmpeg are downloaded and checksum-verified by the
      # script itself; there is nothing to configure. The cache below is a
      # speed-up, never a correctness dependency — a corrupt or missing cache
      # entry is re-downloaded and re-verified.
      - name: Cache staged dependencies
        uses: actions/cache@v4
        with:
          path: chengflow-ui/src-tauri/.deps-cache
          key: desktop-deps-${{ runner.os }}-${{ hashFiles('chengflow-ui/scripts/fetch-desktop-deps.py') }}

      - name: Stage bundled dependencies
        working-directory: chengflow-ui
        run: python3 scripts/fetch-desktop-deps.py

      # Runs against the binaries that are about to be packaged: initialize a
      # cluster, start it, create the database, connect, stop. A bundle whose
      # PostgreSQL cannot start is worth catching here rather than in a user's
      # first launch.
      - name: Verify the bundled PostgreSQL actually runs
        working-directory: chengflow-ui/src-tauri
        run: cargo test -- --ignored --nocapture full_postgres_lifecycle

      - name: Build the bundle
        working-directory: chengflow-ui
        shell: bash
        run: ./scripts/build-desktop.sh

      # LAN host mode serves the frontend embedded in the binary, stamping a
      # fresh CSP nonce into index.html per response. A build whose shell lost
      # the placeholder would serve pages whose inline script the CSP blocks.
      - name: Verify the embedded web UI can be served over the LAN
        working-directory: chengflow-ui
        shell: bash
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          grep -q '__CSP_NONCE__' dist/index.html \
            || { echo "dist/index.html lost its __CSP_NONCE__ placeholder"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: chengflow-desktop-${{ matrix.artifact }}
          path: |
            chengflow-ui/src-tauri/target/release/bundle/deb/*.deb
            chengflow-ui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
