name: Validate Release

# Release validation gate. Runs on every tag push to verify version consistency
# and release script integrity. Binary builds and Docker image publishing are
# performed locally — chengflow source is not pushed to this repository.
#
#   validate  -> tag == VERSION, shell syntax, updater tests
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check version consistency (tag == VERSION)
        run: ./scripts/check-release-consistency.sh --tag "${GITHUB_REF_NAME}"

      - name: Run fast release contract gates
        run: ./scripts/test-release-contract.sh --tag "${GITHUB_REF_NAME}" --fast

      - name: Updater smoke tests
        run: bash deploy/tests/update-smoke.sh
