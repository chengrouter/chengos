name: Build and Release ChengOS

# Gated release sequence. Each job is a gate, and a failure at any gate must not
# publish anything or advance a floating tag:
#
#   validate  -> source and version consistency
#   build     -> compile Rust + frontends ONCE; verify, checksum, and sign the
#                native archive; hand the same outputs to the docker job
#   docker    -> package those outputs into the four exact-tag images and push
#   publish   -> smoke-test the exact outputs, then create the GitHub Release
#   floating  -> only now move :MAJOR.MINOR and :latest
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: chengos

jobs:
  # ── Gate 1: the tag, VERSION, and the Cargo workspace version must agree ────
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      minor: ${{ steps.resolve.outputs.minor }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          # Build from the tag itself, never from a mutable branch.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve version from the tag
        id: resolve
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=$(printf '%s' "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          # Anything that is not a strict stable SemVer is published as a
          # prerelease so it never becomes GitHub's `latest` stable release.
          if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version consistency (tag == VERSION == Cargo workspace)
        run: ./scripts/check-release-consistency.sh --tag "${GITHUB_REF_NAME}"

      - name: Run fast release contract gates
        run: ./scripts/test-release-contract.sh --tag "${GITHUB_REF_NAME}" --fast

  # ── Gate 2: build everything exactly once ─────────────────────────────────
  # Rust binaries and both frontends are compiled here and nowhere else. The
  # native archive is verified, checksummed, and signed in this job; the same
  # compiled outputs are handed to the docker job as artifacts, so no source is
  # ever built twice in a release.
  build:
    name: Build, verify, and sign artifacts
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write   # keyless signing
    env:
      CHENGOS_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools (Required for static compilation)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: |
            chengflow-ui/pnpm-lock.yaml
            chengflow-app/pnpm-lock.yaml

      - name: Build chengflow-ui
        run: |
          cd chengflow-ui
          pnpm install --no-frozen-lockfile
          pnpm build:deploy

      - name: Build chengflow-app
        run: |
          cd chengflow-app
          pnpm install --no-frozen-lockfile
          pnpm build:deploy

      - name: Stage Frontend Assets for Deployment
        run: |
          mkdir -p deploy/ui deploy/app
          rm -rf deploy/ui/* deploy/app/*
          cp -a chengflow-ui/dist/. deploy/ui/
          cp -a chengflow-app/dist-app/. deploy/app/

      - name: Build Backend & Package Hybrid Bundle
        run: |
          cd chengflow
          # CHENGOS_VERSION comes from the immutable tag, so the binaries, the
          # bundled VERSION file, and the archive name all carry one version.
          # This is also the only Rust compilation in the whole workflow.
          ./build.sh --hybrid --with-cli

      - name: Verify archive layout and embedded version
        run: |
          ./scripts/verify-release-archive.sh \
            --archive "dist/chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz" \
            --expect-version "${CHENGOS_VERSION}"

      - name: Verify binary version reporting
        run: |
          set -euo pipefail
          reported="$(chengflow/target/x86_64-unknown-linux-musl/release/cheng-api --version | awk '{print $2}')"
          [[ "$reported" == "${CHENGOS_VERSION}" ]] || { echo "cheng-api reported ${reported}"; exit 1; }
          reported="$(chengflow/target/x86_64-unknown-linux-musl/release/cheng --version | awk '{print $2}')"
          [[ "$reported" == "${CHENGOS_VERSION}" ]] || { echo "cheng reported ${reported}"; exit 1; }

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd dist
          # The checksum is generated after the final archive exists and lives
          # beside it, never inside the archive it checks.
          archive="chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz"
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archive (keyless)
        run: |
          set -euo pipefail
          cd dist
          archive="chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${archive}.sig" \
            --output-certificate "${archive}.pem" \
            "$archive"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-artifacts
          path: |
            dist/chengos-full-linux-amd64-v*.tar.gz
            dist/chengos-full-linux-amd64-v*.tar.gz.sha256
            dist/chengos-full-linux-amd64-v*.tar.gz.sig
            dist/chengos-full-linux-amd64-v*.tar.gz.pem
          if-no-files-found: error

      - name: Collect image inputs
        run: |
          set -euo pipefail
          # Exactly what the four Dockerfiles COPY: two musl binaries and two
          # prebuilt frontend bundles. Everything else in each build context
          # comes from the tagged checkout.
          mkdir -p image-inputs/bin image-inputs/ui image-inputs/app
          cp chengflow/target/x86_64-unknown-linux-musl/release/cheng-api image-inputs/bin/
          cp chengflow/target/x86_64-unknown-linux-musl/release/cheng image-inputs/bin/
          cp -a chengflow-ui/dist/. image-inputs/ui/
          cp -a chengflow-app/dist-app/. image-inputs/app/

      - name: Upload image inputs
        uses: actions/upload-artifact@v4
        with:
          name: image-inputs
          path: image-inputs
          if-no-files-found: error
          retention-days: 1

  # ── Gate 3: all four images under exact immutable tags ─────────────────────
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [validate, build]
    env:
      CHENGOS_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download image inputs
        uses: actions/download-artifact@v4
        with:
          name: image-inputs
          path: image-inputs

      - name: Place prebuilt outputs into the build contexts
        run: |
          set -euo pipefail
          # No compiler, no Node, and no cargo run in this job: the images
          # package exactly the binaries and bundles the build job produced and
          # the native artifact was verified against.
          mkdir -p chengflow/target/x86_64-unknown-linux-musl/release
          cp image-inputs/bin/cheng-api chengflow/target/x86_64-unknown-linux-musl/release/
          cp image-inputs/bin/cheng chengflow/target/x86_64-unknown-linux-musl/release/
          chmod +x chengflow/target/x86_64-unknown-linux-musl/release/cheng-api \
                   chengflow/target/x86_64-unknown-linux-musl/release/cheng
          rm -rf chengflow-ui/dist chengflow-app/dist-app
          mkdir -p chengflow-ui/dist chengflow-app/dist-app
          cp -a image-inputs/ui/. chengflow-ui/dist/
          cp -a image-inputs/app/. chengflow-app/dist-app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push all four images under exact tags
        id: build
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          common_args=(
            --build-arg "CHENGOS_VERSION=${CHENGOS_VERSION}"
            --build-arg "CHENGOS_REVISION=${revision}"
            --build-arg "CHENGOS_SOURCE=${source_url}"
            --push
          )

          # The release fails if ANY of the four images cannot be built or
          # pushed: a partial Docker release is not a release.
          docker buildx build "${common_args[@]}" \
            -t "${IMAGE_NAMESPACE}/chengos:${CHENGOS_VERSION}" \
            -f chengflow/Dockerfile chengflow

          docker buildx build "${common_args[@]}" \
            -t "${IMAGE_NAMESPACE}/chengos_cli:${CHENGOS_VERSION}" \
            -f chengflow/crates/cheng-cli/Dockerfile chengflow

          docker buildx build "${common_args[@]}" \
            -t "${IMAGE_NAMESPACE}/chengos_ui:${CHENGOS_VERSION}" \
            -f chengflow-ui/Dockerfile.dist chengflow-ui

          # Dockerfile.dist packages the prebuilt dist-app/; the plain
          # Dockerfile would rebuild the frontend a second time inside Docker.
          docker buildx build "${common_args[@]}" \
            -t "${IMAGE_NAMESPACE}/chengos_app:${CHENGOS_VERSION}" \
            -f chengflow-app/Dockerfile.dist chengflow-app

      - name: Verify image labels and record digests
        id: manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            printf '{\n  "version": "%s",\n  "revision": "%s",\n  "images": [\n' \
              "${CHENGOS_VERSION}" "${GITHUB_SHA}"
            first=true
            for repo in chengos chengos_ui chengos_app chengos_cli; do
              ref="${IMAGE_NAMESPACE}/${repo}:${CHENGOS_VERSION}"
              digest="$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')"
              label_version="$(docker buildx imagetools inspect "$ref" --format '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || echo '')"
              if [[ -n "$label_version" && "$label_version" != "${CHENGOS_VERSION}" ]]; then
                echo "image ${ref} carries version label '${label_version}'" >&2
                exit 1
              fi
              $first || printf ',\n'
              first=false
              printf '    {"image": "%s", "tag": "%s", "digest": "%s"}' \
                "${IMAGE_NAMESPACE}/${repo}" "${CHENGOS_VERSION}" "$digest"
            done
            printf '\n  ]\n}\n'
          } > dist/release-manifest.json
          cat dist/release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/release-manifest.json
          if-no-files-found: error

  # ── Gate 4: smoke-test the exact outputs, then publish ─────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build, docker]
    permissions:
      contents: write
    env:
      CHENGOS_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-artifacts
          path: dist

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: dist

      - name: Smoke-test the exact published outputs
        run: |
          set -euo pipefail
          archive="dist/chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz"
          ( cd dist && sha256sum -c "$(basename "$archive").sha256" )
          ./scripts/verify-release-archive.sh --archive "$archive" --expect-version "${CHENGOS_VERSION}"
          # A tampered byte must fail verification.
          cp "$archive" /tmp/tampered.tar.gz
          printf 'x' >> /tmp/tampered.tar.gz
          if ( cd /tmp && sha256sum -c "${GITHUB_WORKSPACE}/dist/$(basename "$archive").sha256" >/dev/null 2>&1 ); then
            echo "checksum verification accepted a tampered archive" >&2
            exit 1
          fi

      - name: Assemble release notes from the tagged CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          # The body is the tagged CHANGELOG section, so it is reproducible
          # from the tagged source.
          awk -v version="${CHENGOS_VERSION}" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          {
            echo "## ChengOS ${CHENGOS_VERSION}"
            echo ""
            cat "$notes_file"
            echo ""
            echo "### Supported platform"
            echo ""
            echo "Native artifact: Linux x86_64 (amd64), statically linked against musl."
            echo "Other architectures are not published by this release."
            echo ""
            echo "### Verify the download"
            echo ""
            echo '```bash'
            echo "curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${CHENGOS_VERSION}/chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz"
            echo "curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${CHENGOS_VERSION}/chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz.sha256"
            echo "sha256sum -c chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz.sha256"
            echo ""
            echo "# Authenticity (keyless signature):"
            echo "cosign verify-blob \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz.pem \\"
            echo "  --signature chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz.sig \\"
            echo "  chengos-full-linux-amd64-v${CHENGOS_VERSION}.tar.gz"
            echo '```'
            echo ""
            echo "### Docker images (exact, immutable)"
            echo ""
            echo '```'
            echo "${IMAGE_NAMESPACE}/chengos:${CHENGOS_VERSION}"
            echo "${IMAGE_NAMESPACE}/chengos_ui:${CHENGOS_VERSION}"
            echo "${IMAGE_NAMESPACE}/chengos_app:${CHENGOS_VERSION}"
            echo "${IMAGE_NAMESPACE}/chengos_cli:${CHENGOS_VERSION}"
            echo '```'
            echo ""
            echo "Exact digests are published as the \`release-manifest.json\` asset."
            echo "Pin with \`CHENGOS_VERSION=${CHENGOS_VERSION}\`; \`latest\` is never a reproducible pin."
            echo ""
            echo "### Update and rollback"
            echo ""
            echo "\`./chengos.sh update\` upgrades and verifies; \`./chengos.sh rollback\` reverts."
            echo "See the [release operations guide](https://github.com/${GITHUB_REPOSITORY}/blob/v${CHENGOS_VERSION}/chengflow/docs/release-operations-guide.md)."
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          prerelease: ${{ needs.validate.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/chengos-full-linux-amd64-v*.tar.gz
            dist/chengos-full-linux-amd64-v*.tar.gz.sha256
            dist/chengos-full-linux-amd64-v*.tar.gz.sig
            dist/chengos-full-linux-amd64-v*.tar.gz.pem
            dist/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 5: floating tags move only after everything above succeeded ───────
  floating-tags:
    name: Advance floating Docker tags
    runs-on: ubuntu-latest
    needs: [validate, publish]
    # Floating tags are convenience selectors. They are never an update target
    # and never a rollback target, and they only move for a stable release.
    if: needs.validate.outputs.prerelease == 'false'
    steps:
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag :MAJOR.MINOR and :latest from the exact release tags
        env:
          CHENGOS_VERSION: ${{ needs.validate.outputs.version }}
          CHENGOS_MINOR: ${{ needs.validate.outputs.minor }}
        run: |
          set -euo pipefail
          for repo in chengos chengos_ui chengos_app chengos_cli; do
            src="${IMAGE_NAMESPACE}/${repo}:${CHENGOS_VERSION}"
            docker buildx imagetools create -t "${IMAGE_NAMESPACE}/${repo}:${CHENGOS_MINOR}" "$src"
            docker buildx imagetools create -t "${IMAGE_NAMESPACE}/${repo}:latest" "$src"
          done
