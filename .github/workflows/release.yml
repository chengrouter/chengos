name: Validate Release

# Release validation gate. Runs on every tag push to verify version consistency
# and release script integrity. Binary builds and Docker image publishing are
# performed locally — chengflow source is not pushed to this repository.
#
#   validate  -> tag == VERSION, shell syntax, updater tests
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check version consistency (tag == VERSION)
        run: ./scripts/check-release-consistency.sh --tag "${GITHUB_REF_NAME}"

      - name: Run fast release contract gates
        run: ./scripts/test-release-contract.sh --tag "${GITHUB_REF_NAME}" --fast

      - name: Updater smoke tests
        run: bash deploy/tests/update-smoke.sh

      # The marketing site links straight at `releases/latest/download/<asset>`,
      # so a release published without one of those assets turns a download
      # button on the site into a 404 -- silently, and for everyone, until
      # somebody clicks it. Failing the release instead is the cheaper failure.
      #
      # The manifest is the site's, and the site lives in another repository, so
      # this needs MARKETING_MANIFEST pointing at a checkout of it. When that is
      # not configured the step says so and passes: a gate that cannot see what
      # it is gating must not pretend to have checked. When it IS configured and
      # the file is missing, that is a broken gate and the release stops.
      - name: Verify release assets match the marketing site
        env:
          MARKETING_MANIFEST: ${{ vars.MARKETING_MANIFEST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${MARKETING_MANIFEST}" ]; then
            echo "MARKETING_MANIFEST is not set; the marketing download gate did not run."
            exit 0
          fi
          if [ ! -f "${MARKETING_MANIFEST}" ]; then
            echo "MARKETING_MANIFEST is set to '${MARKETING_MANIFEST}' but no such file exists." >&2
            exit 1
          fi
          node scripts/verify-marketing-release-assets.mjs \
            --tag "${GITHUB_REF_NAME}" --manifest "${MARKETING_MANIFEST}"
