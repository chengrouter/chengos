services:
  postgres:
    image: postgres:18-alpine
    container_name: chengos-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: master_router
      POSTGRES_USER: tianai_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianai_db -d master_router"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chengos-redis
    env_file:
      - .env
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --save 900 1 --save 300 10 --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass \"$REDIS_PASSWORD\"",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  chengos-app:
    image: ${CHENGOS_IMAGE:-chengos/chengos:latest}
    container_name: chengos-app
    env_file:
      - .env
    environment:
      SKILLS_DIR: /app/skills
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./skills:/app/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
