# Global node presets (shared across all workspaces).
#
# Per-workspace presets.yaml can override types/presets with the same id
# (case-insensitive) and add new ones; see PresetService::load.
#
# Top-level keys:
#   preset_types – categories shown as the first selection level
#   presets      – named config patches for one node type
#
# Preset fields:
#   id           – stable, file-unique identity
#   preset_type  – the category id this preset belongs to
#   node_type    – registered node type id this patch is valid for
#                  (must match a real typeId, e.g. tools/code_python)
#   label        – display label
#   description  – optional human/LLM-facing explanation
#   llm_visible  – whether scoped LLM discovery may surface it (default false)
#   risk_level   – optional: "low", "medium", or "high"
#   config_patch – JSON object shallow-merged into the target node's config

preset_types:
  - id: tool_nodes
    label: Tool nodes
    description: Presets for tool nodes

  - id: ai_nodes
    label: AI nodes
    description: Presets for AI/LLM nodes

presets:
  # Python executor — primary code preset used by LLM discovery when
  # tools/code_python is connected alongside the agent.
  - id: code-safe-mode
    preset_type: tool_nodes
    node_type: tools/code_python
    label: Code execution safe mode
    description: Restrict workspace writes and full-disk reads
    llm_visible: true
    risk_level: high
    config_patch:
      allow_filesystem: false
      allow_full_disk_readonly: false

  - id: code-full-access
    preset_type: tool_nodes
    node_type: tools/code_python
    label: Code execution full access
    description: Allow workspace writes and full-disk reads
    llm_visible: false
    risk_level: high
    config_patch:
      allow_filesystem: true
      allow_full_disk_readonly: true

  # Shell executor (default-enabled code node) — separate ids because each
  # preset targets exactly one registered node type.
  - id: code-shell-safe-mode
    preset_type: tool_nodes
    node_type: tools/code_shell
    label: Shell execution safe mode
    description: Restrict filesystem writes, network, and full-disk reads
    llm_visible: true
    risk_level: high
    config_patch:
      allow_filesystem: false
      allow_network: false
      allow_full_disk_readonly: false
      disable_sandbox: false

  - id: code-shell-full-access
    preset_type: tool_nodes
    node_type: tools/code_shell
    label: Shell execution full access
    description: Allow workspace writes, network, and full-disk reads (still sandboxed)
    llm_visible: false
    risk_level: high
    config_patch:
      allow_filesystem: true
      allow_network: true
      allow_full_disk_readonly: true
      disable_sandbox: false

  - id: search-strict
    preset_type: tool_nodes
    node_type: tools/search_files
    label: Search strict mode
    description: Cap returned matches for focused searches
    config_patch:
      max_results: 10

  - id: agent-deep-think
    preset_type: ai_nodes
    node_type: agent/react_agent
    label: Agent deep think
    description: Raise the per-turn iteration budget for harder tasks
    llm_visible: true
    risk_level: medium
    config_patch:
      max_iterations: 30
