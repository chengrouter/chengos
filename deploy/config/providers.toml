# LLM 提供商白名单配置
# 所有支持的提供商必须在此注册
# 
# 配置字段说明：
# - name: 显示名称
# - type: builtin | openai_compatible | custom
# - credential_schema: 引用 credential_schemas 中定义的 Schema
# - supports_chat: 是否支持对话
# - supports_embedding: 是否支持向量嵌入
# - supports_reranker: 是否支持重排序
# - fetch_models_enabled: 是否支持动态拉取模型列表
# - default_*_models: 默认模型列表（无法动态拉取时使用）

# ==================== 凭证 Schema 定义 ====================
# 定义每种凭证类型需要的字段，前端根据此配置动态渲染表单
# 字段类型: string | integer | boolean
# secret: 标记敏感字段，前端显示为密码框，后端脱敏处理

