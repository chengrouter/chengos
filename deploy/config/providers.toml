type = "openai_compatible"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["ernie-5.1", "ernie-5.0", "ernie-x1.1", "ernie-4.5-turbo-128k"]

[providers.qianfan.capabilities]
native_tool_calling = true
streaming_tool_calling = true
system_message = "native"
input_modalities = ["text", "image"]
context_window = 131072
max_input_tokens = 128000

[providers.qianfan.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "disabled"

# ==================== Reranker 专用提供商 ====================

[providers.cohere]
name = "Cohere"
type = "builtin"
credential_schema = "api_key_only"
supports_chat = false
supports_embedding = true
supports_reranker = true
fetch_models_enabled = false
default_embedding_models = ["embed-english-v3.0", "embed-multilingual-v3.0"]
default_reranker_models = ["rerank-english-v3.0", "rerank-multilingual-v3.0"]

[providers.jina]
name = "Jina AI"
type = "builtin"
credential_schema = "api_key_only"
supports_chat = false
supports_embedding = true
supports_reranker = true
fetch_models_enabled = false
default_embedding_models = ["jina-embeddings-v3"]
default_reranker_models = ["jina-reranker-v2-base-multilingual"]

# ==================== 通用 OpenAI 兼容提供商 ====================

# custom 不通过 endpoint URL 猜测厂商：默认保守（仅文本对话），
# tools / JSON / 多模态需通过凭证或节点上的显式 compatibility_profile
# （conservative | openai | deepseek | minimax | zhipu）开启。
[providers.custom]
name = "Custom (OpenAI Compatible)"
type = "openai_compatible"
credential_schema = "custom_llm"
supports_chat = true
supports_embedding = true
supports_reranker = false
fetch_models_enabled = true

[providers.custom.behavior]
protocol_family = "custom_open_ai_compatible"
tool_call_recovery = "disabled"
