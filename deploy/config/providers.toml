# ==================== 内置提供商 ====================
#
# capabilities / behavior 段说明（能力与行为策略，按 provider + model 解析）：
# - 未声明的能力一律视为不支持（fail-closed）：tools / JSON / 多模态默认关闭
# - capabilities 描述模型/API 能做什么；behavior 描述适配层如何处理厂商差异
# - [[providers.X.model_overrides]] 按 pattern（精确名或尾部通配 *）覆盖差异，
#   最具体的匹配生效；provider 级默认即为兜底，无需配置 pattern = "*"
# - 声明必须与 provider 实现一致，不得提前声明未实现的能力

[providers.openai]
name = "OpenAI"
type = "builtin"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = true
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo", "gpt-3.5-turbo"]
default_embedding_models = ["text-embedding-3-small", "text-embedding-3-large", "text-embedding-ada-002"]

[providers.openai.capabilities]
native_tool_calling = true
streaming_tool_calling = true
parallel_tool_calling = true
json_mode = "json_object"
system_message = "native"
input_modalities = ["text", "image", "audio", "file"]
# gpt-4o / gpt-4-turbo class: 128K context. Older 16K models overridden below.
context_window = 128000
max_input_tokens = 128000

[providers.openai.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "disabled"

# gpt-3.5-turbo is a 16K-context model, not 128K.
[[providers.openai.model_overrides]]
pattern = "gpt-3.5-turbo*"

[providers.openai.model_overrides.capabilities]
context_window = 16385
max_input_tokens = 16385

# 媒体生成模型：仅声明输出模态（供 generate_media 路由/校验），
# 聊天类能力沿用 provider 默认但对这些模型无实际意义。
[[providers.openai.model_overrides]]
pattern = "gpt-image-*"

[providers.openai.model_overrides.capabilities]
output_modalities = ["image"]

[[providers.openai.model_overrides]]
pattern = "dall-e-*"

[providers.openai.model_overrides.capabilities]
output_modalities = ["image"]

[[providers.openai.model_overrides]]
pattern = "tts-*"

[providers.openai.model_overrides.capabilities]
output_modalities = ["audio"]

[providers.anthropic]
name = "Anthropic (Claude)"
type = "builtin"
credential_schema = "api_key_only"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["claude-3-5-sonnet-latest", "claude-3-5-haiku-latest", "claude-3-opus-latest"]

# 当前 Anthropic provider 实现未编码 tools / JSON mode，因此不声明。
[providers.anthropic.capabilities]
system_message = "native"
input_modalities = ["text", "image"]
# Claude 3.x / 3.5 family: 200K context.
context_window = 200000
max_input_tokens = 200000

[providers.anthropic.behavior]
protocol_family = "anthropic_messages"
tool_call_recovery = "disabled"

[providers.ollama]
name = "Ollama"
type = "builtin"
credential_schema = "endpoint_only"
supports_chat = true
supports_embedding = true
supports_reranker = false
fetch_models_enabled = true

# Ollama provider 实现支持 format: "json"，未实现 tools。
[providers.ollama.capabilities]
json_mode = "json_object"
system_message = "native"
input_modalities = ["text"]

[providers.ollama.behavior]
protocol_family = "ollama_chat"
tool_call_recovery = "disabled"

[providers.lm-studio]
name = "LM Studio"
type = "builtin"
credential_schema = "endpoint_only"
supports_chat = true
supports_embedding = true
supports_reranker = false
fetch_models_enabled = true

# 本地服务：加载的模型决定实际能力；实现层会透传图片内容块（视觉模型）。
# tools 声明为乐观默认（多数指令模型支持），但实际能力取决于所加载模型，
# 故启用 strict_json 恢复：若模型未走原生 function calling 而以 JSON 文本
# 返回工具调用，响应管线会将其归一化为统一 ToolCall，而非作为普通文本泄漏。
[providers.lm-studio.capabilities]
native_tool_calling = true
streaming_tool_calling = true
system_message = "native"
input_modalities = ["text", "image"]

[providers.lm-studio.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "strict_json"

[providers.vllm]
name = "vLLM"
type = "builtin"
credential_schema = "endpoint_only"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true

# 本地 OpenAI 兼容服务：实现支持原生 tools 并聚合流式 tool 增量，
# 无图片内容块透传，故仅文本。加载的模型决定实际能力，因此与 LM Studio 一致
# 启用 strict_json 恢复，兜底以 JSON 文本返回工具调用的模型。
[providers.vllm.capabilities]
native_tool_calling = true
streaming_tool_calling = true
system_message = "native"
input_modalities = ["text"]

[providers.vllm.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "strict_json"

[providers.gemini]
name = "Google Gemini"
type = "builtin"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = true
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["gemini-2.0-flash-exp", "gemini-1.5-pro", "gemini-1.5-flash"]
default_embedding_models = ["text-embedding-004", "embedding-001"]

# Gemini provider 实现支持非流式 tools（functionDeclarations），
# 流式响应未聚合 tool 增量，因此带工具时强制非流式。
[providers.gemini.capabilities]
native_tool_calling = true
streaming_tool_calling = false
system_message = "native"
input_modalities = ["text"]
# Gemini 1.5/2.0 long-context family: 1M+ tokens. Declare ~1M input so AgentLimits
# derives a large history budget (learned backoff handles any real overflow).
context_window = 1048576
max_input_tokens = 1000000

[providers.gemini.behavior]
protocol_family = "gemini_generate_content"
tool_call_recovery = "disabled"
force_non_streaming_with_tools = true

# 图像生成模型：Imagen 走 :predict，gemini-*-image 走 :generateContent
# （responseModalities 含 IMAGE），均由 GeminiMediaProvider 适配。
[[providers.gemini.model_overrides]]
pattern = "imagen-*"

[providers.gemini.model_overrides.capabilities]
output_modalities = ["image"]

[[providers.gemini.model_overrides]]
pattern = "gemini-2.5-flash-image*"

[providers.gemini.model_overrides.capabilities]
output_modalities = ["image"]

[providers.deepseek]
name = "DeepSeek"
type = "openai_compatible"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["deepseek-chat", "deepseek-reasoner"]

# max_output_tokens 接管原 LlmService::normalize_chat_request 中的
# DeepSeek 8192 上限硬编码（Phase 3 迁移后由统一请求管线执行钳制）。
[providers.deepseek.capabilities]
native_tool_calling = true
streaming_tool_calling = true
system_message = "native"
input_modalities = ["text"]
max_output_tokens = 8192
# deepseek-chat / deepseek-reasoner: 64K context.
context_window = 65536
max_input_tokens = 65536

[providers.deepseek.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "strict_json"

[providers.minimax]
name = "MiniMax"
type = "builtin"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true
default_chat_models = ["MiniMax-M2.7", "MiniMax-M2.7-highspeed", "MiniMax-M2.5", "MiniMax-M2.5-highspeed", "MiniMax-M2.1", "MiniMax-M2.1-highspeed", "MiniMax-M2"]

# MiniMax: system 角色由统一管线合并进 user；temperature 仅接受 (0, 1]；
# 工具调用偶发以 XML/文本形式返回，由响应管线按白名单恢复。
[providers.minimax.capabilities]
native_tool_calling = true
streaming_tool_calling = true
parallel_tool_calling = false
json_mode = "unsupported"
system_message = "merge_into_user"
input_modalities = ["text"]
# MiniMax M2 / abab long-context family: declare ~245K input (≥ the 200K default,
# so a known improvement; learned backoff recovers from any real overflow).
context_window = 245760
max_input_tokens = 245760

[providers.minimax.capabilities.sampling]
temperature_min = 0.01
temperature_max = 1.0
temperature_zero_allowed = false

[providers.minimax.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "minimax_xml_and_strict_json"
force_non_streaming_with_tools = false
tolerate_stream_tail_after_output = true

# 视频生成模型：异步 submit/poll/retrieve 流程，由 MiniMaxMediaProvider 适配。
[[providers.minimax.model_overrides]]
pattern = "video-01*"

[providers.minimax.model_overrides.capabilities]
output_modalities = ["video"]

[[providers.minimax.model_overrides]]
pattern = "MiniMax-Hailuo-*"

[providers.minimax.model_overrides.capabilities]
output_modalities = ["video"]

[providers.zhipu]
name = "智谱 (ZhipuAI)"
type = "builtin"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = false
supports_reranker = false
fetch_models_enabled = true

[providers.zhipu.capabilities]
native_tool_calling = true
streaming_tool_calling = true
system_message = "native"
input_modalities = ["text"]

[providers.zhipu.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "registered_tool_text_and_strict_json"

# GLM-5 current generation advertises a 1MB-class context. Declare it here so
# AgentLimits can derive a large history budget instead of treating GLM as an
# unknown-window provider and falling back to the conservative 32K-token default.
[[providers.zhipu.model_overrides]]
pattern = "glm-5*"

[providers.zhipu.model_overrides.capabilities]
context_window = 1048576
max_input_tokens = 1000000

# GLM-4V 系列支持图片输入。
[[providers.zhipu.model_overrides]]
pattern = "glm-4v*"

[providers.zhipu.model_overrides.capabilities]
input_modalities = ["text", "image"]

[providers.dashscope]
name = "Alibaba Cloud DashScope (Qwen)"
type = "builtin"
credential_schema = "api_key_with_endpoint"
supports_chat = true
supports_embedding = true
supports_reranker = true
fetch_models_enabled = false
default_chat_models = ["qwen3.7-max", "qwen3.7-plus", "qwen3.6-plus", "qwen3-coder-plus"]
default_embedding_models = ["text-embedding-v3"]
default_reranker_models = ["gte-rerank"]

# DashScope 的 OpenAI 兼容模式：Qwen 文本模型支持原生 function calling、
# 流式 tool 增量与 response_format=json_object。声明显式 capabilities/behavior，
# 避免回落到保守默认（CustomOpenAiCompatible）导致协议族与可观测性不准确。
[providers.dashscope.capabilities]
native_tool_calling = true
streaming_tool_calling = true
json_mode = "json_object"
system_message = "native"
input_modalities = ["text"]
# qwen-plus class: ~131K context. qwen-max (32K) and qwen-turbo (1M) overridden below.
context_window = 131072
max_input_tokens = 129024

[providers.dashscope.behavior]
protocol_family = "open_ai_chat_completions"
tool_call_recovery = "disabled"

# Qwen-VL 系列支持图片输入。
[[providers.dashscope.model_overrides]]
pattern = "qwen-vl*"

[providers.dashscope.model_overrides.capabilities]
input_modalities = ["text", "image"]

# qwen-max is a 32K-context model.
[[providers.dashscope.model_overrides]]
pattern = "qwen-max*"

[providers.dashscope.model_overrides.capabilities]
context_window = 32768
max_input_tokens = 30720

# qwen-turbo is a 1M-context model.
[[providers.dashscope.model_overrides]]
pattern = "qwen-turbo*"

[providers.dashscope.model_overrides.capabilities]
context_window = 1000000
max_input_tokens = 1000000

