schema_version: "1"

name: skill-importer
display_name: Skill Importer
description: Imports external Skill source into a persistent workspace package, edits it through guarded file operations, and validates the on-disk package for human review.
version: 1.0.0
category: meta
tags:
  - skill
  - import
  - meta
  - workflow

backend:
  type: workflow
  workflow_id: "b9d3f0a4-1dd1-4dc5-8d9d-63f82e0ef9f2"

input_schema:
  type: object
  required:
    - source_type
    - source_location
  properties:
    source_type:
      type: string
      enum: [repository, url, pasted_text, skill_md]
    source_location:
      type: string
      description: Git URL, HTTP URL, or short identifier for pasted text.
    source_content:
      type: string
      description: Optional raw content (for pasted_text or skill_md modes).
    skill_name_hint:
      type: string
      description: Preferred slug for the resulting ChengOS skill (kebab-case).
    branch:
      type: string
      description: Optional git branch for repository imports.

output_schema:
  type: object
  properties:
    success: { type: boolean }
    skill_name: { type: string }
    package_path: { type: string }
    changed_files: { type: array, items: { type: string } }
    normalization_status: { type: string }
    backend_type:
      type: string
      description: Backend kind of the imported skill (workflow | cli | agentic | reference).
    llm_tools:
      type: object
      description: LLM-visible tool surface for an agentic import (llm_tools.expose). Absent for non-agentic skills.
    requires_tool_review:
      type: boolean
      description: True when llm_tools.expose or tool_hub.tools grants broad/high-risk access and must be reviewed before the skill is promoted to ready.
    warnings: { type: array, items: { type: string } }

credentials:
  required: []

runtime_dependencies:
  bins:
    - git

permissions:
  read_only: false
  allowed_actions:
    - skill.import.fetch
    - skill.import.inspect
    - skill.import.edit
    - skill.import.validate
  denied_actions: []

approval:
  required_at_or_above: high
  default_risk: high
  action_name_template: "skill:skill-importer:{source_location}"
  description_template: "Import skill from {source_location}"
  param_summary_fields:
    - source_type
    - source_location
    - skill_name_hint
  timeout_seconds: 600

execution:
  mode: workflow
  auto_execute: false
  async_allowed: true
  timeout_seconds: 1800

normalization:
  status: needs_review
  confidence: 1.0
  warnings: []

# Parent Tool Hub compatibility scope. The importer workflow's internal Agent
# receives its four tools directly from workflow edges; this separate scope only
# permits a parent Agent to inspect an imported package without mutating it.
tool_hub:
  tools:
    - tool: tools/file_ops_hub
      operations:
        - view_file
        - list_directory
      purpose: Inspect imported Skill source and package files while assisting an import.
      constraints:
        allowed_paths:
          - skills/
      config:
        allow_read_content: true
        allow_list_directory: true
        allow_write: false
      read_only: true

source:
  kind: native
  format: chengos
  path: skills/skill-importer/skill.yaml
