# .env directory mount (applied automatically by lib/compose-files.sh once the
# instance .env has moved to env/.env).
#
# The base file mounts ../.env as a single file. A single-file bind mount pins
# one inode: a host-side temp-file + rename is never seen by the container, and
# the settings panel cannot replace the mount point from inside it. Mounting
# the directory instead makes both directions atomic and visible, with one
# lock file (env/.env.lock) shared by the host scripts and the API.

services:
  api:
    environment:
      CHENGOS_ENV_FILE: /app/env/.env
    volumes:
      - ../env:/app/env
