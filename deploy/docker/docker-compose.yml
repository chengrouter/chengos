# ChengOS application services resolve their image tag from a single
# CHENGOS_VERSION pin, so API, UI, App, and CLI can never be combined from
# unrelated releases. `chengos.sh update` writes that pin only after the exact
# release has been verified, and `chengos.sh rollback` writes the previous one.
#
# CHENGOS_*_IMAGE overrides still win per service (private registries and
# development builds), but any override disables coordinated release updates —
# `chengos.sh status` reports that explicitly.
#
# `latest` is a convenience default for a first install only. It is never an
# update target and never a reproducible production pin.
services:
  postgres:
    image: postgres:18-alpine
    container_name: chengos-postgres
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: master_router
      POSTGRES_USER: tianai_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianai_db -d master_router"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8.0.9-alpine
    container_name: chengos-redis
    env_file:
      - path: ../.env
        required: false
    command:
      [
        "sh",
        "-c",
        "exec valkey-server --appendonly yes --save 900 1 --save 300 10 --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # Do not reuse a Redis 7.4+ / 8.x persistence volume: its RDB/AOF is
      # incompatible with Valkey. The prior redis_data volume is retained.
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  qdrant:
    # Pinned like every other infra image: `latest` would let the vector store
    # drift between installs and break reproducibility. v1.19.0 is the digest
    # `latest` resolved to when this was pinned, so behavior is unchanged.
    image: qdrant/qdrant:v1.19.0
    container_name: chengos-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    image: ${CHENGOS_API_IMAGE:-chengos/chengos:${CHENGOS_VERSION:-latest}}
    container_name: chengos-api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://tianai_db:${POSTGRES_PASSWORD:-change_this_postgres_password}@postgres:5432/master_router
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379
      QDRANT_URL: http://qdrant:6334
      CHENG_CLI_ALLOWED_ROOTS: /app/workspace
      SKILLS_DIR: /app/skills
      NODE_SKILLS_DIR: /app/node_skills
      CHENG_GLOBAL_CONFIG_DIR: /app/config
      TEMPLATE_WORKFLOWS_DIR: /app/workflow-templates
    volumes:
      - ../config:/app/config
      - ../skills:/app/skills
      - ../logs:/app/logs
      - ../runtime:/app/runtime
      - ../models:/home/chengos/.chengflow/models
      - ../node_skills:/app/node_skills
      - ../workspace:/app/workspace
      - ../workflow-templates:/app/workflow-templates:ro
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    command: ["--log-file", "/app/logs/cheng-api.log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ui:
    image: ${CHENGOS_UI_IMAGE:-chengos/chengos_ui:${CHENGOS_VERSION:-latest}}
    container_name: chengos-ui
    environment:
      API_BASE_URL: ${UI_API_BASE_URL:-/api/v1}
      WS_URL: ${UI_WS_URL:-/ws}
      BACKEND_UPSTREAM: http://api:3000
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ${CHENGOS_APP_IMAGE:-chengos/chengos_app:${CHENGOS_VERSION:-latest}}
    container_name: chengos-app
    environment:
      API_BASE_URL: ${APP_API_BASE_URL:-/api/v1}
      WS_URL: ${APP_WS_URL:-/ws/executions}
      BACKEND_HTTP_URL: http://api:3000
      BACKEND_WS_URL: http://api:3000
      CHANNEL_ID: ${APP_CHANNEL_ID:-weather-app}
      BOUND_WORKFLOW_ID: ${APP_BOUND_WORKFLOW_ID:-}
    ports:
      - "127.0.0.1:${APP_PORT:-5055}:5055"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cli:
    image: ${CHENGOS_CLI_IMAGE:-chengos/chengos_cli:${CHENGOS_VERSION:-latest}}
    container_name: chengos-cli
    env_file:
      - path: ../.env
        required: false
    environment:
      CHENG_SERVER_URL: ${CHENG_SERVER_URL:-http://api:3000}
      CHENG_CLI_ALLOWED_ROOTS: /app/workspace
      CHENG_CLI_LOG_FILE: /app/logs/cheng-cli.log
    volumes:
      - ../workspace:/app/workspace
      - ../logs:/app/logs
      - ../config:/app/config:ro
      - ../runtime:/app/runtime:ro
      - cheng_cli_config:/home/chengos/.config/cheng
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - cli
    stdin_open: true
    tty: true
    entrypoint: ["/usr/local/bin/cheng"]
    command: []
    restart: "no"

volumes:
  postgres_data:
  valkey_data:
  qdrant_data:
  cheng_cli_config:
