# Remote deployment override.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d
#
# This file assumes an external reverse proxy such as Cloudflare Tunnel, Caddy,
# Nginx Proxy Manager, or Traefik will terminate HTTPS and route to the exposed
# host ports. The browser still talks to each frontend same-origin; each frontend
# container proxies /api and /ws to the api service over the Docker network.

services:
  api:
    environment:
      CORS_PERMISSIVE: "false"
      CORS_ALLOWED_ORIGINS: "${PUBLIC_UI_URL},${PUBLIC_APP_URL}"

  ui:
    environment:
      API_BASE_URL: /api/v1
      WS_URL: /ws
      BACKEND_UPSTREAM: http://api:3000

  app:
    environment:
      API_BASE_URL: /api/v1
      WS_URL: /ws/executions
      BACKEND_HTTP_URL: http://api:3000
      BACKEND_WS_URL: http://api:3000
