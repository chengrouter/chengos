[package]
name = "skill-registry"
version = "0.1.0"
edition = "2021"
description = "ChengOS Skills Registry — independent catalog, publishing, scanning, and artifact service"
license = "Apache-2.0"
default-run = "skill-registry"

# Independent workspace: this package must NOT join the chengflow Cargo
# workspace and must not depend on cheng-core / cheng-storage / cheng-api.
[workspace]

[dependencies]
# HTTP / runtime
axum = { version = "0.7", features = ["macros", "http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.4", features = ["timeout", "limit"] }
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "cors", "request-id", "set-header", "util"] }
hyper = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"

# Persistence
sqlx = { version = "0.7.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script", "streams"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Domain utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
regex = "1"
constant_time_eq = "0.3"
unicode-normalization = "0.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }

# CLI / errors / observability
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = "symbols"
